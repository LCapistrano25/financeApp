name: CD EC2

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cd-ec2-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EC2
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest

    env:
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_APP_PATH: ${{ secrets.EC2_APP_PATH || '/opt/finance-app' }}
      IMAGE_NAME: finance-app:latest
      SSH_KEY_PATH: /home/runner/.ssh/ec2_deploy_key
      SSH_OPTS: -i /home/runner/.ssh/ec2_deploy_key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${EC2_HOST:-}" ]; then
            echo "EC2_HOST secret is empty."
            exit 1
          fi

          if [ -z "${EC2_USER:-}" ]; then
            echo "EC2_USER secret is empty."
            exit 1
          fi

          if [ -z "${EC2_SSH_KEY:-}" ]; then
            echo "EC2_SSH_KEY secret is empty."
            exit 1
          fi

          EC2_HOST="$(printf '%s' "$EC2_HOST" | tr -d '[:space:]' | sed -E 's#^ssh://##; s#^https?://##; s#^[^@]+@##; s#/.*$##; s#:22$##')"
          echo "Using EC2 host: $EC2_HOST"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"
          ssh-keygen -y -f "$SSH_KEY_PATH" > /dev/null

          {
            echo "EC2_HOST=$EC2_HOST"
          } >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL='${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}' \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY='${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}' \
            --build-arg NEXT_PUBLIC_API_URL='${{ secrets.NEXT_PUBLIC_API_URL }}' \
            --build-arg NEXT_PUBLIC_AUTH_REDIRECT_URL='${{ secrets.NEXT_PUBLIC_AUTH_REDIRECT_URL }}' \
            -t "$IMAGE_NAME" .

      - name: Package Docker image
        run: |
          docker save "$IMAGE_NAME" | gzip > "$RUNNER_TEMP/finance-app-image.tar.gz"

      - name: Create production env file
        run: |
          cat > "$RUNNER_TEMP/finance-app.env" <<EOF
          APP_PORT=3000
          KUMA_PORT=3001
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_AUTH_REDIRECT_URL=${{ secrets.NEXT_PUBLIC_AUTH_REDIRECT_URL }}
          EOF

      - name: Upload package to EC2
        run: |
          ssh $SSH_OPTS "$EC2_USER@$EC2_HOST" "mkdir -p '$EC2_APP_PATH'"
          scp $SSH_OPTS "$RUNNER_TEMP/finance-app.env" "$EC2_USER@$EC2_HOST:/tmp/finance-app.env"
          scp $SSH_OPTS "$RUNNER_TEMP/finance-app-image.tar.gz" "$EC2_USER@$EC2_HOST:/tmp/finance-app-image.tar.gz"
          scp $SSH_OPTS docker-compose.ec2.yml "$EC2_USER@$EC2_HOST:$EC2_APP_PATH/docker-compose.yml"

      - name: Deploy with Docker Compose
        timeout-minutes: 10
        run: |
          ssh $SSH_OPTS "$EC2_USER@$EC2_HOST" "
            set -e
            cd '$EC2_APP_PATH'
            mv /tmp/finance-app.env .env
            docker load -i /tmp/finance-app-image.tar.gz
            docker compose up -d --no-build
            docker image prune -f
            rm -f /tmp/finance-app-image.tar.gz
          "
